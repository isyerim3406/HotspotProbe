name: Build independent iOS SOCKS HTTP proxy DEB
on:
  workflow_dispatch:
  push:
    paths:
      - 'iosproxy/**'
      - '.github/workflows/iosproxy-deb.yml'
permissions:
  contents: write
jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS ARM64 native binary
        run: |
          set -eux
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2 -Wall -Wextra -pthread iosproxy/iosproxyd.c -o iosproxyd
          codesign --force --sign - --timestamp=none iosproxyd
          file iosproxyd
          lipo -info iosproxyd
          codesign --verify --verbose iosproxyd
      - uses: actions/upload-artifact@v4
        with:
          name: iosproxyd-arm64-binary
          path: iosproxyd
          if-no-files-found: error
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iosproxyd-arm64-binary
          path: build
      - name: Package rootless deb with no third-party dependencies
        run: |
          set -eux
          mkdir -p stage/DEBIAN stage/var/jb/usr/libexec/iosproxy stage/var/jb/Library/LaunchDaemons
          cp iosproxy/control stage/DEBIAN/control
          cp iosproxy/postinst stage/DEBIAN/postinst
          cp iosproxy/prerm stage/DEBIAN/prerm
          chmod 755 stage/DEBIAN/postinst stage/DEBIAN/prerm
          cp build/iosproxyd stage/var/jb/usr/libexec/iosproxy/iosproxyd
          chmod 755 stage/var/jb/usr/libexec/iosproxy/iosproxyd
          cp iosproxy/launchd.plist stage/var/jb/Library/LaunchDaemons/com.chatin.iosproxy.plist
          dpkg-deb --build --root-owner-group stage com.chatin.iosproxy_0.2.0_iphoneos-arm64.deb
          dpkg-deb --info com.chatin.iosproxy_0.2.0_iphoneos-arm64.deb
          dpkg-deb --contents com.chatin.iosproxy_0.2.0_iphoneos-arm64.deb
          test -z "$(dpkg-deb -f com.chatin.iosproxy_0.2.0_iphoneos-arm64.deb Depends)"
      - uses: actions/upload-artifact@v4
        with:
          name: iOSProxy-rootless-DEB-v0.2.0
          path: com.chatin.iosproxy_0.2.0_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Publish direct DEB download via GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          FILE=com.chatin.iosproxy_0.2.0_iphoneos-arm64.deb
          TAG=iosproxy-v0.2.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "iOSProxy v0.2.0 rootless" --notes "Standalone signed iOS ARM64 HTTP/SOCKS5 proxy. Fixes Sileo unmet Python dependency issue from v0.1.0. Does not change hotspot management."
          fi
