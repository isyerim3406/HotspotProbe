name: Build iOS Hotspot Keepalive rootless DEB
on:
  workflow_dispatch:
  push:
    paths:
      - 'keepalive/**'
      - '.github/workflows/keepalive-deb.yml'
permissions:
  contents: write
jobs:
  build-misctl:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned upstream misctl and compile for iOS
        run: |
          set -eux
          curl -fsSL https://raw.githubusercontent.com/maliv2/ios-hotspot-vpn-keepalive/2a92ed122fc9fd95ca48eb1999c8763fafa1637c/phone/tools/misctl.c -o misctl.c
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2 -Wall -Wextra misctl.c -o misctl
          brew install ldid
          ldid -Skeepalive/misctl.xml misctl
          file misctl
          lipo -info misctl
          ldid -e misctl | grep 'com.apple.wifi.manager-access'
      - uses: actions/upload-artifact@v4
        with:
          name: ios-misctl-binary
          path: misctl
  package:
    runs-on: ubuntu-latest
    needs: build-misctl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-misctl-binary
          path: out
      - name: Assemble rootless package from pinned upstream source
        run: |
          set -eux
          mkdir -p stage/DEBIAN stage/var/jb/usr/local/bin stage/var/jb/Library/LaunchDaemons stage/var/jb/var/log
          for name in hotspot keepawake hshold; do
            curl -fsSL "https://raw.githubusercontent.com/maliv2/ios-hotspot-vpn-keepalive/2a92ed122fc9fd95ca48eb1999c8763fafa1637c/phone/${name}.py" -o "stage/var/jb/usr/local/bin/${name}.py"
          done
          cp out/misctl stage/var/jb/usr/local/bin/misctl
          cp keepalive/launchd.plist stage/var/jb/Library/LaunchDaemons/com.mali.keepawake.plist
          cp keepalive/control stage/DEBIAN/control
          cp keepalive/postinst stage/DEBIAN/postinst
          cp keepalive/prerm stage/DEBIAN/prerm
          chmod 755 stage/DEBIAN/postinst stage/DEBIAN/prerm stage/var/jb/usr/local/bin/misctl
          chmod 755 stage/var/jb/usr/local/bin/*.py
          python3 -m py_compile stage/var/jb/usr/local/bin/*.py
          dpkg-deb --build --root-owner-group stage ios-hotspot-keepalive_0.1.0_iphoneos-arm64.deb
          dpkg-deb --info ios-hotspot-keepalive_0.1.0_iphoneos-arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Hotspot-Keepalive-rootless-DEB
          path: ios-hotspot-keepalive_0.1.0_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ios-hotspot-keepalive-v0.1.0
          FILE=ios-hotspot-keepalive_0.1.0_iphoneos-arm64.deb
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Hotspot Keepalive (Experimental) v0.1.0" --notes "Unofficial, experimental rootless repackaging of the keepawake/hshold/misctl subset from maliv2/ios-hotspot-vpn-keepalive at commit 2a92ed122fc9fd95ca48eb1999c8763fafa1637c. Requires Procursus python3. iPhone client requires Wi-Fi-sync pairing (port 62078). NOT tested on iPhone 6s iOS 15. VPN routing excluded. No automatic backups."
          fi
